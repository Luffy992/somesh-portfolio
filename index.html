<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Somesh Ramola – Full Stack & Backend Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#070b1a;--panel:rgba(18,26,56,.55);--line:rgba(120,150,255,.18);--text:#e6eaf7;--mute:#97a3c7;--cy:#5ce1ff;--vi:#8b7bff;--display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px;height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--body);overflow-x:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.glow{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.28;z-index:0;pointer-events:none;background:var(--vi);top:-120px;right:-120px}
.glow.b{background:var(--cy);top:auto;right:auto;bottom:-200px;left:-160px;opacity:.18}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(7,11,26,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav b{font:700 18px var(--display);letter-spacing:.02em}
nav div a{color:var(--mute);text-decoration:none;margin-left:22px;font-size:14px;transition:color .2s}
nav div a:hover{color:var(--cy)}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 5vw}
section{padding:96px 0 24px}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:110px}
.hero h1{font:700 clamp(44px,9vw,104px)/1 var(--display);margin:0 0 18px;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 0%,var(--cy) 35%,var(--vi) 65%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both,shine 6s linear 1s infinite}
.role{font:500 clamp(18px,3vw,28px) var(--display);color:var(--cy);min-height:1.4em}
.role i{display:inline-block;width:2px;height:1em;background:var(--cy);margin-left:4px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
.hero p{max-width:60ch;color:var(--mute);margin:18px 0 30px;animation:rise 1.1s .25s cubic-bezier(.2,.8,.2,1) both}
.btns{display:flex;gap:14px;flex-wrap:wrap;animation:rise 1.1s .4s cubic-bezier(.2,.8,.2,1) both}
.btn{padding:13px 26px;border-radius:999px;text-decoration:none;font:500 15px var(--display);border:1px solid var(--line);color:var(--text);transition:transform .25s,box-shadow .25s,border-color .25s}
.btn.p{background:linear-gradient(100deg,var(--cy),var(--vi));color:#05081a;border:0;font-weight:700}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 34px rgba(92,225,255,.28);border-color:var(--cy)}
h2{font:700 clamp(28px,4.5vw,42px) var(--display);margin:0 0 30px;letter-spacing:-.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.proj{position:relative;transition:transform .3s,border-color .3s;transform-style:preserve-3d}
.proj:hover{border-color:var(--cy)}
.proj h3{font:700 22px var(--display);margin:0 0 8px}
.proj ul,.job ul{padding-left:18px;margin:12px 0;color:var(--mute);font-size:15px}
.proj li,.job li{margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{font-size:12.5px;padding:4px 12px;border-radius:999px;background:rgba(139,123,255,.14);color:#c8c1ff;border:1px solid rgba(139,123,255,.3)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.skills h3{font:500 16px var(--display);color:var(--cy);margin:0 0 12px}
.skills .tags{margin:0}
.job .meta{color:var(--mute);font-size:14px}
.job h3{font:700 22px var(--display);margin:0 0 4px}
.edu{display:grid;gap:14px}
.edu div{border-left:2px solid var(--vi);padding-left:16px}
.edu b{font-family:var(--display)}
.edu small{display:block;color:var(--mute)}
.contact{text-align:center;padding-bottom:60px}
.contact .btns{justify-content:center}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:13px;padding:30px 0 40px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@media(max-width:640px){nav div a:nth-child(-n+2){display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@keyframes shine{to{background-position:-220% 0}}
.glow{animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-90px,100px) scale(1.25)}}
.card{position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(92,225,255,.14),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::after{opacity:1}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.proj::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 65%,var(--cy),var(--vi),transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;transition:opacity .4s;animation:spin 4s linear infinite;pointer-events:none}
.proj:hover::before{opacity:1}
@keyframes spin{to{--a:360deg}}
.rv .tags span{opacity:0;transform:scale(.7)}
.rv.in .tags span{animation:pop .55s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i,0)*45ms + 250ms)}
@keyframes pop{to{opacity:1;transform:none}}
.rv h2{background:linear-gradient(90deg,var(--cy),var(--vi)) 0 100%/0 3px no-repeat;padding-bottom:8px;transition:background-size 1s .3s;display:inline-block}
.rv.in h2{background-size:100% 3px}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--cy),var(--vi));z-index:30}
#cur{position:fixed;top:0;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--cy);border-radius:50%;pointer-events:none;z-index:40;transition:width .25s,height .25s,margin .25s,background .25s;mix-blend-mode:screen}
#cur.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(92,225,255,.12)}
@media(pointer:coarse){#cur{display:none}}
@media(prefers-reduced-motion:reduce){.rv .tags span{opacity:1;transform:none}.rv h2{background-size:100% 3px}}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
</style>
</head>
<body>
<canvas id="net" aria-hidden="true"></canvas><div class="glow"></div><div class="glow b"></div>
<nav><b>SR</b><div><a href="#about">About</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#contact">Contact</a></div></nav>
<main id="app"></main>
<footer id="foot"></footer>
<script>
/* ===== EDIT YOUR CONTENT HERE ===== */
const DATA={
 name:"Somesh Ramola",
 roles:["Full Stack Developer","Backend Engineer","Spring Boot & Node.js","REST API Builder"],
 intro:"I build secure, scalable REST APIs and web apps with Java, Spring Boot, Node.js and React – layered backends, JWT/OAuth2 security, and clean deployments.",
 about:"Full Stack and Backend Developer from Jaipur with hands-on experience in REST APIs, authentication and authorization, database design, microservices and Docker deployment. I like turning ideas into tested, documented, production-style applications.",
 email:"someshramola03@gmail.com",phone:"+91-7597157886",
 linkedin:"https://linkedin.com/in/somesh-ramola",github:"https://github.com/Luffy992",
 skills:{
  "Languages":["Java","JavaScript (ES6+)","TypeScript","SQL"],
  "Backend":["Spring Boot","Spring Security","Spring Data JPA","Hibernate","Node.js","Express.js","NestJS","Microservices"],
  "Frontend":["React.js","Redux Toolkit","Tailwind CSS","Bootstrap","HTML5","CSS3","Axios"],
  "Data & Messaging":["MySQL","MongoDB","MongoDB Atlas","Redis","Apache Kafka"],
  "Security & API":["JWT","OAuth2","Bcrypt","Swagger/OpenAPI"],
  "Tools & Testing":["Git","GitHub","Docker","Maven","Postman","JUnit 5","Mockito","Render"]},
 job:{title:"Back-end Web Development Intern",org:"ElevanceSkills · Remote",when:"Jul 2026 – Aug 2026",points:[
  "Built RESTful APIs with Node.js and Express.js in a layered architecture.",
  "Designed MongoDB collections, implemented CRUD and optimized queries.",
  "Secured endpoints with JWT authentication and role-based authorization.",
  "Integrated backend with frontend apps and tested with Postman.",
  "Worked in Agile using Git and GitHub: features, code reviews, debugging."]},
 projects:[
  {t:"Swiggy Backend Clone",d:["Food-delivery backend: auth, restaurants, menus, cart, orders, coupons.","JWT, role-based access (User, Restaurant, Admin) and bcrypt hashing.","Search, order validation, delivery-partner assignment, surge pricing, recommendations."],tags:["React","Node.js","Express","MongoDB Atlas","JWT","Docker","Render"]},
  {t:"Task Management System",d:["Full-stack board with To Do, Doing and Completed workflows, priorities, due dates, assignees and labels.","NestJS + TypeScript APIs with search, filtering and light/dark dashboard."],tags:["React","TypeScript","NestJS","REST","Render"]},
  {t:"E-Commerce Backend",d:["Registration, login and product APIs with JWT, refresh tokens and RBAC.","Pagination, validation, DTOs, custom exceptions and Swagger docs.","JUnit 5 tests on a Controller–Service–Repository design."],tags:["Spring Boot","Spring Security","MySQL","JPA/Hibernate","Swagger","JUnit 5"]}],
 edu:[["MCA, Computer Science","Maharishi Arvind University, Jaipur","2024 – 2026"],["BCA, Computer Science","SSG Pareek PG College, Jaipur","2021 – 2024"],["Senior Secondary (Commerce)","N.K. Public School, Jaipur","2020 – 2021"]]
};
/* ===== RENDER ===== */
const D=DATA,$=s=>document.querySelector(s);
const tags=a=>a.map(x=>`<span>${x}</span>`).join("");
$("#app").innerHTML=`
<section class="hero"><div class="role"><span id="rt"></span><i></i></div><h1>${D.name}</h1><p>${D.intro}</p>
<div class="btns"><a class="btn p" href="#projects">View projects</a><a class="btn" href="${D.github}" target="_blank" rel="noopener">GitHub</a><a class="btn" href="#contact">Contact me</a></div></section>
<section id="about" class="rv"><h2>About</h2><div class="card"><p style="margin:0;color:var(--mute)">${D.about}</p></div></section>
<section id="skills" class="rv"><h2>Skills</h2><div class="skills">${Object.entries(D.skills).map(([k,v])=>`<div class="card"><h3>${k}</h3><div class="tags">${tags(v)}</div></div>`).join("")}</div></section>
<section id="experience" class="rv"><h2>Experience</h2><div class="card job"><h3>${D.job.title}</h3><div class="meta">${D.job.org} · ${D.job.when}</div><ul>${D.job.points.map(p=>`<li>${p}</li>`).join("")}</ul></div></section>
<section id="projects" class="rv"><h2>Projects</h2><div class="grid">${D.projects.map(p=>`<div class="card proj"><h3>${p.t}</h3><ul>${p.d.map(x=>`<li>${x}</li>`).join("")}</ul><div class="tags">${tags(p.tags)}</div></div>`).join("")}</div></section>
<section class="rv"><h2>Education</h2><div class="card edu">${D.edu.map(e=>`<div><b>${e[0]}</b><small>${e[1]} · ${e[2]}</small></div>`).join("")}</div></section>
<section id="contact" class="rv contact"><h2>Let’s build something</h2><p style="color:var(--mute)">${D.phone} · ${D.email}</p>
<div class="btns"><a class="btn p" href="mailto:${D.email}">Email me</a><a class="btn" href="${D.linkedin}" target="_blank" rel="noopener">LinkedIn</a><a class="btn" href="${D.github}" target="_blank" rel="noopener">GitHub</a></div></section>`;
$("#foot").textContent=`© 2026 ${D.name}`;
/* typewriter */
(function(){const el=$("#rt");let r=0,c=0,del=false;
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=D.roles[0];return}
 (function t(){const w=D.roles[r];el.textContent=w.slice(0,c);
  if(!del&&c===w.length){del=true;return setTimeout(t,1400)}
  if(del&&c===0){del=false;r=(r+1)%D.roles.length}
  c+=del?-1:1;setTimeout(t,del?35:70)})()})();
/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
/* 3D tilt on project cards */
document.querySelectorAll(".proj").forEach(c=>{
 c.addEventListener("mousemove",e=>{const b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transform=`perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-4px)`});
 c.addEventListener("mouseleave",()=>c.style.transform="")});
/* constellation canvas */
(function(){const cv=$("#net"),g=cv.getContext("2d");let W,H,P=[],m={x:-999,y:-999};
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(90,Math.floor(W*H/16000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};
 addEventListener("resize",rs);addEventListener("mousemove",e=>{m.x=e.clientX;m.y=e.clientY});rs();
 const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function f(){g.clearRect(0,0,W,H);
  for(const p of P){if(!still){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
   const dm=Math.hypot(p.x-m.x,p.y-m.y);if(dm<140&&!still){p.x+=(p.x-m.x)*.012;p.y+=(p.y-m.y)*.012}
   g.fillStyle="rgba(92,225,255,.8)";g.beginPath();g.arc(p.x,p.y,1.6,0,6.3);g.fill()}
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
   if(d<130){g.strokeStyle=`rgba(139,123,255,${.32*(1-d/130)})`;g.lineWidth=1;g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke()}}
  for(const p of P){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<170){g.strokeStyle=`rgba(92,225,255,${.5*(1-d/170)})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(m.x,m.y);g.stroke()}}
  if(!still)requestAnimationFrame(f)}
 f()})();
/* extra motion */
(function(){
 const bar=document.createElement("div");bar.id="bar";document.body.append(bar);
 addEventListener("scroll",()=>{const h=document.documentElement;bar.style.transform=`scaleX(${scrollY/Math.max(1,h.scrollHeight-innerHeight)})`},{passive:true});
 document.querySelectorAll(".tags").forEach(t=>[...t.children].forEach((s,i)=>s.style.setProperty("--i",i)));
 document.querySelectorAll(".card").forEach(c=>c.addEventListener("pointermove",e=>{const b=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-b.left+"px");c.style.setProperty("--my",e.clientY-b.top+"px")}));
 document.querySelectorAll(".btn").forEach(b=>{
  b.addEventListener("mousemove",e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`});
  b.addEventListener("mouseleave",()=>b.style.transform="")});
 if(matchMedia("(pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
  const c=document.createElement("div");c.id="cur";document.body.append(c);let x=-99,y=-99,tx=-99,ty=-99;
  addEventListener("mousemove",e=>{tx=e.clientX;ty=e.clientY});
  document.addEventListener("mouseover",e=>c.classList.toggle("big",!!e.target.closest("a,.btn,.card")));
  (function l(){x+=(tx-x)*.18;y+=(ty-y)*.18;c.style.transform=`translate(${x}px,${y}px)`;requestAnimationFrame(l)})();
 }
})();
</script>
</body>
</html>
